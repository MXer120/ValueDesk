AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Valuescan edge: private S3 bucket for the built site, CloudFront (OAC, SPA
  routing, /api/* to the instance with the origin secret), the production
  security headers and CSP, the ACM certificate, optional WAF and DNS records.
  Deploy in us-east-1. See deploy/aws/README.md.

# Stack 3 of 3. Region: us-east-1, ALWAYS - a CloudFront certificate and a WAF
# web ACL for CloudFront can only be created there. The instance may be anywhere.
#
# The header values below are docs/deploy/SECURITY-HEADERS.md section 1, and the
# CSP is the <meta> policy of apps/web/index.html plus the three directives only a
# header can carry. deploy/aws/validate_offline.py fails when they drift apart,
# and deploy/smoke serves the local build with the same values.

Parameters:
  DomainName:
    Type: String
    AllowedPattern: '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$'
    ConstraintDescription: a lower-case DNS name such as valuescan.example
    Description: The site's domain name, e.g. valuescan.example or app.valuescan.example.
  HostedZoneId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^Z[A-Z0-9]{5,31}$'
    Description: >-
      Route 53 hosted zone that contains DomainName. With it the certificate is
      validated and the alias records are created automatically. Empty: create the
      validation CNAME (shown in the stack events) and the records yourself.
  ApiOriginDomainName:
    Type: String
    AllowedPattern: '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$'
    ConstraintDescription: a lower-case DNS name such as origin.valuescan.example
    Description: >-
      DNS name of the instance (compute.yaml output OriginDomainName). CloudFront
      sends /api/* there over HTTPS; the name must match Caddy's certificate.
  OriginVerifySecret:
    Type: String
    NoEcho: true
    MinLength: 32
    MaxLength: 128
    AllowedPattern: '^[A-Za-z0-9._~-]+$'
    ConstraintDescription: 32 to 128 characters of A-Z a-z 0-9 . _ ~ -
    Description: >-
      Value CloudFront sends to the origin as X-Origin-Verify. It must equal
      VALUESCAN_ORIGIN_SECRET on the instance. Never commit it: pass it from SSM
      Parameter Store at deploy time (deploy/aws/README.md).
  PriceClass:
    Type: String
    Default: PriceClass_All
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: Which CloudFront edge locations serve the site.
  EnableWaf:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Attach an AWS WAF web ACL: a per-address rate limit on /api/* and two AWS
      managed rule groups. About 8 USD a month plus 0.60 USD per million requests.
  WafApiRateLimit:
    Type: Number
    Default: 2000
    MinValue: 100
    MaxValue: 2000000
    Description: Requests to /api/* one address may make in 5 minutes before WAF blocks it.
  GeoRestrictionType:
    Type: String
    Default: none
    AllowedValues: [none, blacklist, whitelist]
    Description: >-
      CloudFront country restriction for the whole site: none, blacklist (refuse the
      listed countries) or whitelist (serve only the listed ones). Which countries,
      if any, is a legal decision for the owner (docs/deploy/DEPLOY.md).
  GeoRestrictionCountries:
    Type: CommaDelimitedList
    Default: ''
    Description: >-
      ISO 3166-1 alpha-2 country codes for GeoRestrictionType, comma-separated
      (e.g. "US,GB"). Ignored when the type is none.

Conditions:
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, '']]
  UseWaf: !Equals [!Ref EnableWaf, 'true']
  NoGeoRestriction: !Equals [!Ref GeoRestrictionType, none]

Resources:
  # --- the site bucket ---------------------------------------------------------------

  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # index.html is overwritten by every release; its previous versions are a
      # second way back (deploy/release keeps the builds themselves as the first).
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 3

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site'
        Description: CloudFront reads the private site bucket with SigV4.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Only this distribution may read the bucket. No s3:ListBucket: a missing file
  # is a 403, never a listing.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # --- certificate ---------------------------------------------------------------------

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - HasHostedZone
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZoneId
        - !Ref 'AWS::NoValue'

  # --- routing ---------------------------------------------------------------------------

  # The app is a single-page app with flat routes (/trade, /explore, /scan?address=...).
  # A path whose last segment has no dot is an app route and gets the shell.
  #
  # This is a function on the SITE behaviours and not a distribution-wide custom
  # error response on purpose: an error response would also turn the API's own 403
  # and 404 into "200 index.html", and the web reads those statuses.
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-spa-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Serve the app shell for app routes and the legacy /scan/ redirect page
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
            var request = event.request;
            var uri = request.uri;
            // public/scan/index.html forwards links saved from the old Scan page.
            if (uri === '/scan/') {
                request.uri = '/scan/index.html';
                return request;
            }
            var name = uri.slice(uri.lastIndexOf('/') + 1);
            if (name.indexOf('.') === -1) {
                request.uri = '/index.html';
            }
            return request;
        }

  # --- caching ----------------------------------------------------------------------------

  # Site objects carry their own Cache-Control (set by deploy/release/publish-web.sh):
  # index.html no-cache, logos a day, everything hashed a year (see /assets/* below).
  # An object published without the header is not cached at all.
  SiteCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-site'
        Comment: Honour the object Cache-Control; nothing in the cache key but the path.
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  # The API decides what may be cached (apps/server/src/perf.ts): the index routes
  # send "public, max-age=10, stale-while-revalidate=20", the live ones "public,
  # no-cache", everything else "no-store". CloudFront honours that, never beyond a
  # minute. The key holds the query string and Origin (docs/deploy/SECURITY-HEADERS.md 2.2).
  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-api'
        Comment: Honour the origin Cache-Control (max 60 s); key = path + query string + Origin.
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 60
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - Origin
          CookiesConfig:
            CookieBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: all

  # --- response headers (docs/deploy/SECURITY-HEADERS.md section 1) ---------------------------

  # Every site response, /assets/*.js included: the SharedWorker that holds the
  # exchange sockets takes its policy from its own script response (option A of 1.2.1).
  SiteHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-site'
        Comment: docs/deploy/SECURITY-HEADERS.md section 1 - the site policy
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'self';
              script-src 'self';
              style-src 'self' 'unsafe-inline';
              img-src 'self' data: blob: https://api.web3modal.org;
              font-src 'self';
              frame-src https://verify.walletconnect.org;
              worker-src 'self';
              connect-src 'self'
              https://mainnet-gw.sodex.dev wss://mainnet-gw.sodex.dev
              https://testnet-gw.sodex.dev wss://testnet-gw.sodex.dev
              https://mainnet-data.sodex.dev https://testnet-data.sodex.dev
              https://alpha-biz.sodex.dev
              https://api.hyperliquid.xyz https://mainnet.zklighter.elliot.ai https://api.arcus.xyz
              wss://relay.walletconnect.org https://api.web3modal.org
              https://main-scan.valuechain.xyz
              https://rpc.valuechain.xyz https://arb1.arbitrum.io https://mainnet.base.org
              https://ethereum-rpc.publicnode.com https://bsc-dataseed.bnbchain.org
              https://polygon-bor-rpc.publicnode.com;
              form-action 'none';
              base-uri 'none';
              object-src 'none';
              manifest-src 'self';
              frame-ancestors 'none';
              upgrade-insecure-requests
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: false
          FrameOptions:
            Override: true
            FrameOption: DENY
          ContentTypeOptions:
            Override: true
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
          XSSProtection:
            Override: true
            Protection: false
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Override: true
              Value: accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=(), xr-spatial-tracking=(), browsing-topics=(), clipboard-read=(), clipboard-write=(self), fullscreen=(self)
            - Header: Cross-Origin-Opener-Policy
              Override: true
              Value: same-origin-allow-popups
            - Header: Cross-Origin-Resource-Policy
              Override: true
              Value: same-origin
        RemoveHeadersConfig:
          Items:
            - Header: Server

  # /scan/*: the redirect page for old links keeps one inline script; its hash is
  # the only difference from the site policy. Recompute it when that script changes
  # (the command is in SECURITY-HEADERS.md; validate_offline.py checks it).
  ScanHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-scan'
        Comment: docs/deploy/SECURITY-HEADERS.md section 1 - the legacy /scan/ redirect page
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'self';
              script-src 'self' 'sha256-bXJtqdhzu4xrNuZI44nF3t24LtnovVLjGKp0GValFLk=';
              style-src 'self' 'unsafe-inline';
              img-src 'self' data: blob: https://api.web3modal.org;
              font-src 'self';
              frame-src https://verify.walletconnect.org;
              worker-src 'self';
              connect-src 'self'
              https://mainnet-gw.sodex.dev wss://mainnet-gw.sodex.dev
              https://testnet-gw.sodex.dev wss://testnet-gw.sodex.dev
              https://mainnet-data.sodex.dev https://testnet-data.sodex.dev
              https://alpha-biz.sodex.dev
              https://api.hyperliquid.xyz https://mainnet.zklighter.elliot.ai https://api.arcus.xyz
              wss://relay.walletconnect.org https://api.web3modal.org
              https://main-scan.valuechain.xyz
              https://rpc.valuechain.xyz https://arb1.arbitrum.io https://mainnet.base.org
              https://ethereum-rpc.publicnode.com https://bsc-dataseed.bnbchain.org
              https://polygon-bor-rpc.publicnode.com;
              form-action 'none';
              base-uri 'none';
              object-src 'none';
              manifest-src 'self';
              frame-ancestors 'none';
              upgrade-insecure-requests
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: false
          FrameOptions:
            Override: true
            FrameOption: DENY
          ContentTypeOptions:
            Override: true
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
          XSSProtection:
            Override: true
            Protection: false
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Override: true
              Value: accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=(), xr-spatial-tracking=(), browsing-topics=(), clipboard-read=(), clipboard-write=(self), fullscreen=(self)
            - Header: Cross-Origin-Opener-Policy
              Override: true
              Value: same-origin-allow-popups
            - Header: Cross-Origin-Resource-Policy
              Override: true
              Value: same-origin
        RemoveHeadersConfig:
          Items:
            - Header: Server

  # /logos/* and /addrbook/*: third-party SVGs (audit W-09). Nothing may run in one
  # that is opened directly.
  ImagesHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-images'
        Comment: docs/deploy/SECURITY-HEADERS.md section 1 - third-party image directories
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox"
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: false
          FrameOptions:
            Override: true
            FrameOption: DENY
          ContentTypeOptions:
            Override: true
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
          XSSProtection:
            Override: true
            Protection: false
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Override: true
              Value: accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=(), xr-spatial-tracking=(), browsing-topics=(), clipboard-read=(), clipboard-write=(self), fullscreen=(self)
            - Header: Cross-Origin-Opener-Policy
              Override: true
              Value: same-origin-allow-popups
            - Header: Cross-Origin-Resource-Policy
              Override: true
              Value: same-origin
        RemoveHeadersConfig:
          Items:
            - Header: Server

  # /api/*: the API sends its own headers (SECURITY-HEADERS.md 2.2). Only HSTS is
  # added, and only when the origin did not send it.
  ApiHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-api'
        Comment: docs/deploy/SECURITY-HEADERS.md section 1.3 - the API keeps its own headers
        SecurityHeadersConfig:
          StrictTransportSecurity:
            Override: false
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: false
        RemoveHeadersConfig:
          Items:
            - Header: Server

  # --- WAF (optional; docs/deploy/SECURITY-HEADERS.md 2.4) ------------------------------------

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: UseWaf
    Properties:
      Name: !Sub '${AWS::StackName}-edge'
      Description: Coarse backstop in front of the API - a per-address rate limit and AWS managed rules
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${AWS::StackName}-edge'
      Rules:
        - Name: api-rate-limit
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref WafApiRateLimit
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  SearchString: /api/
                  PositionalConstraint: STARTS_WITH
                  FieldToMatch:
                    UriPath: {}
                  TextTransformations:
                    - Priority: 0
                      Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${AWS::StackName}-api-rate-limit'
        - Name: aws-common
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              ScopeDownStatement:
                ByteMatchStatement:
                  SearchString: /api/
                  PositionalConstraint: STARTS_WITH
                  FieldToMatch:
                    UriPath: {}
                  TextTransformations:
                    - Priority: 0
                      Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${AWS::StackName}-aws-common'
        - Name: aws-known-bad-inputs
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${AWS::StackName}-aws-known-bad-inputs'

  # --- the distribution ---------------------------------------------------------------------

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'Valuescan site and index API (${DomainName})'
        Aliases:
          - !Ref DomainName
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        DefaultRootObject: index.html
        WebACLId: !If [UseWaf, !GetAtt WebAcl.Arn, !Ref 'AWS::NoValue']
        Restrictions:
          GeoRestriction: !If
            - NoGeoRestriction
            - RestrictionType: none
            - RestrictionType: !Ref GeoRestrictionType
              Locations: !Ref GeoRestrictionCountries
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Ref ApiOriginDomainName
            # A stopped instance must fail fast, not hold every index request for 30 s.
            ConnectionAttempts: 2
            ConnectionTimeout: 5
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
              OriginSSLProtocols:
                - TLSv1.2
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 30
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginVerifySecret
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref SiteCachePolicy
          ResponseHeadersPolicyId: !Ref SiteHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          # The index API: 16 GET routes in hosted mode. No POST reaches the origin.
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref ApiCachePolicy
            ResponseHeadersPolicyId: !Ref ApiHeadersPolicy
          # Content-hashed files: cached for a year at the edge and in the browser.
          # 658327ea-... is the managed policy CachingOptimized.
          - PathPattern: /assets/*
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: !Ref SiteHeadersPolicy
          - PathPattern: /logos/*
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref SiteCachePolicy
            ResponseHeadersPolicyId: !Ref ImagesHeadersPolicy
          - PathPattern: /addrbook/*
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref SiteCachePolicy
            ResponseHeadersPolicyId: !Ref ImagesHeadersPolicy
          - PathPattern: /scan/*
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref SiteCachePolicy
            ResponseHeadersPolicyId: !Ref ScanHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN

  # --- DNS (optional) --------------------------------------------------------------------------

  # Z2FDTNDATAQYW2 is CloudFront's own hosted zone id, the same for every distribution.
  SiteRecordA:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  SiteRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  SiteUrl:
    Description: The site.
    Value: !Sub 'https://${DomainName}'
  DistributionId:
    Description: CloudFront distribution id (invalidations).
    Value: !Ref Distribution
  DistributionDomainName:
    Description: The distribution's own name. Alias DomainName to it if the zone is not in Route 53.
    Value: !GetAtt Distribution.DomainName
  SiteBucketName:
    Description: The private bucket the built site is published to.
    Value: !Ref SiteBucket
  CertificateArn:
    Description: The site certificate.
    Value: !Ref Certificate
