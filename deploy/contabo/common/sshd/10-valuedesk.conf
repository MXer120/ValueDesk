# /etc/ssh/sshd_config.d/10-valuedesk.conf - installed by deploy/contabo/apply-overlay.sh.
#
# Keys only. Contabo's image ships 50-cloud-init.conf with "PasswordAuthentication yes",
# and the user `admin` HAS a password (with sudo, no password asked): together, every
# bot on the internet could try it (thousands of tries a day, /var/log/btmp). sshd takes
# the FIRST value it reads and reads these files in name order, so 10- wins over 50-.
#
# Who may log in: almalinux (the key in ~/.ssh/valuescan-contabo on the owner's laptop;
# server 1 also lets server 2's ledger-pull key run builder-snapshot.sh only), and
# vsbackup (the other server's backup key, backup-receive.sh only). The console in
# Contabo's panel (VNC) does not go through sshd: `admin` and its password still work there.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
AllowUsers almalinux vsbackup
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
# Post-quantum key exchange first (ML-KEM and Streamlined NTRU Prime hybrids, OpenSSH
# 9.9): AlmaLinux's crypto policy leaves both out, so a recorded session could be
# decrypted later by a quantum computer. The classic curve stays for older clients.
KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512,sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
