[Service]
# Contabo Cloud VPS 12 (47 GB): the whole index in page cache, room for every Hyperliquid wallet.
ExecStart=
# Through the supervisor (valuescan-indexer.service: handover restarts); the indexer's own command line after supervisor.ts.
ExecStart=/opt/node/current/bin/node --disable-warning=ExperimentalWarning --import tsx src/indexer/supervisor.ts --max-old-space-size=8192 --disable-warning=ExperimentalWarning --import tsx src/indexer/main.ts
MemoryHigh=36G
MemoryMax=40G
