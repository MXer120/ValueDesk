# /etc/systemd/journald.conf.d/valuescan.conf - installed by bootstrap.sh.
#
# Every Valuescan service logs to the journal (no log files, so nothing for
# logrotate). The API's request lines carry client addresses, which are personal
# data: keep them 14 days at most (docs/deploy/SECURITY-HEADERS.md 2.5), and
# never let logs fill the root volume.

[Journal]
MaxRetentionSec=14day
SystemMaxUse=1G
SystemKeepFree=2G
Compress=yes
