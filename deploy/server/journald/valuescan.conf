# /etc/systemd/journald.conf.d/valuescan.conf - installed by bootstrap.sh.
#
# Every Valuescan service logs to the journal (no log files, so nothing for
# logrotate). This is the MAIN journal: the indexer, the health check, the backups,
# Caddy, sshd, the kernel, systemd itself - what happened on the server, kept for
# a year so that it can always be looked up afterwards (2026-10-27: the owner).
#
# PERSISTENT. Contabo's AlmaLinux image has no /var/log/journal, so journald kept
# everything in /run (memory) and lost it at every reboot; Storage=persistent
# creates /var/log/journal/<machine-id> and writes there.
#
# NOT HERE: the API's request lines (client IP addresses) and the copy executor's
# operating log (wallet addresses). The privacy policy promises both are deleted
# after 90 days (apps/web/src/legal/privacy.ts), so those two units log into their
# own journal namespace "pii" (LogNamespace=pii in their units), which keeps 90 days
# (journald@pii.conf next to this file):
#   journalctl --namespace=pii -u valuescan-api -f
# A year for those too needs the privacy policy changed first.
#
# Size: about 10 MB a day on server 1 (half of it ssh login attempts), 2 MB on server 2
# (measured 2026-10-27, compressed export): a year is 1-4 GB. The cap is generous;
# SystemKeepFree keeps the disk from ever filling with logs.
#
# The journal is also copied off the server once a day (backup-offsite.sh, set
# "journal"): a dead disk does not take the year of logs with it.

[Journal]
Storage=persistent
MaxRetentionSec=1year
SystemMaxUse=40G
SystemKeepFree=15G
MaxFileSec=1month
Compress=yes
