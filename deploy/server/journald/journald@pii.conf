# /etc/systemd/journald@pii.conf - installed by bootstrap.sh.
#
# The journal namespace "pii": the logs that hold personal data, kept 90 days and no
# longer, as the privacy policy promises (apps/web/src/legal/privacy.ts):
#   valuescan-api.service       request lines with the client's IP address and path
#   valuescan-executor.service  the executor's operating log (wallet addresses, the
#                               leader copied, the path of a request that failed)
# Both units say LogNamespace=pii; systemd starts systemd-journald@pii for them.
#
#   journalctl --namespace=pii -u valuescan-api -f
#   journalctl --namespace=pii -u valuescan-executor -n 100
#
# This namespace is NOT copied off the server (backup-offsite.sh exports the main
# journal only) and rsyslog does not see it, so no other copy outlives the 90 days.
# The executor's durable record of what it did is its audit table in executor.db,
# which the off-server backup does carry.

[Journal]
Storage=persistent
MaxRetentionSec=90day
MaxFileSec=1day
SystemMaxUse=4G
SystemKeepFree=15G
Compress=yes
