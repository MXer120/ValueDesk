# The OFF-BOX watcher (deploy/watch/uptime.mjs): probes https://www.valuedesk.so/, its
# /api/health (server 1 through Vercel) and /api/copy/v1/health (server 2 through server 1)
# from GitHub's machines, with retries, and sends Telegram on down / still down / back up.
# The servers watch themselves and each other every minute (healthcheck.mjs); this
# catches both of them dead at once, or Vercel and the network in front of them.
#
# SECRETS (Settings -> Secrets and variables -> Actions -> New repository secret):
#   TELEGRAM_TOKEN    the bot's token (the same bot as the servers' alert.env)
#   TELEGRAM_CHAT_ID  the chat id telegram-setup.sh printed
#
# HOW OFTEN. GitHub bills a private repository's scheduled runs by the minute, each run
# rounded up to a whole minute: every 5 minutes is ~8,600 minutes a month - more than
# any plan includes (Free 2,000, Pro 3,000), and once they are used up CI stops too.
# So this runs every 30 minutes (~1,450 minutes a month). For 5 minutes: make the
# repository public, or buy minutes, then change the cron line to '*/5 * * * *'.
# (GitHub also starts scheduled runs late at busy times, by minutes.)
#
# The state between runs (what is down since when) is a small file kept with
# actions/cache: restored from the newest earlier run, saved under this run's id.
name: Uptime

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy/watch
            deploy/server/bin
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Last state
        uses: actions/cache/restore@v4
        with:
          path: .uptime-state
          key: uptime-state-${{ github.run_id }}
          restore-keys: uptime-state-

      - name: Probe
        run: node deploy/watch/uptime.mjs --state=.uptime-state/state.json
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Keep the state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .uptime-state
          key: uptime-state-${{ github.run_id }}
