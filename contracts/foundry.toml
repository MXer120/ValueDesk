# Valuescan copy trading contract. Local build and test only: NOTHING is deployed or broadcast from this project
# without the owner's explicit go. Do not add rpc_endpoints with keys, and never pass --broadcast.

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
cache_path = "cache"

# Pinned compiler. 0.8.36 (2026-07-09) is the newest release with more than two months in the field. Its three
# known bugs (MisorderedNamedParametersInRequireWithCustomErrors, MemoryByteArrayElementDeleteClearsWholeWord,
# SpillSlotCollisionAcrossMutualRecursion) are avoided by coding rule: no named arguments in require(cond, Error(...)),
# no `delete` of elements of memory byte arrays, no recursion at all (via_ir is on; see below). See README.md.
solc_version = "0.8.36"
auto_detect_solc = false

# ValueChain (chain id 286623) runs the Prague hard fork: PUSH0, TSTORE/TLOAD, MCOPY, BLOBBASEFEE, the BLS12-381
# precompile at 0x0b and the block header field requestsHash are all present; CLZ (0x1e, Osaka) is rejected.
# Evidence: README.md "EVM version". Never raise this to osaka until ValueChain upgrades.
evm_version = "prague"

optimizer = true
optimizer_runs = 200
# On because of EIP-170: the UUPS implementation is 22.4 KB with via-IR and 28 KB without (limit 24,576 bytes; the
# test suite asserts at least 1.5 KB of headroom for future upgrades). The known via-IR bug in 0.8.36
# (SpillSlotCollisionAcrossMutualRecursion) needs mutual recursion; the contract has no recursion of any kind.
# Test gotcha under via-IR: never re-read block.timestamp after vm.warp in a test (the optimiser may reuse the old
# value); use constants or vm.getBlockTimestamp().
# `forge coverage` compiles without the optimizer; use `forge coverage --ir-minimum` (see README.md).
via_ir = true

bytecode_hash = "ipfs"
cbor_metadata = true

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]

# Tests never touch the network or the file system (gas snapshots under snapshots/ are written by forge itself).
fs_permissions = []
# Storage layout in the artifacts, for tools/storage-layout.mjs (the storage-layout guard).
extra_output = ["storageLayout"]

[fuzz]
runs = 1000
seed = "0x5641"

[invariant]
runs = 256
depth = 100
# The handler catches every contract revert itself and models whether it was expected, so any revert that reaches
# the fuzzer is a handler bug and must fail the campaign.
fail_on_revert = true

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 1000
depth = 200

[lint]
# Only the contract is linted; tests and the do-not-run script are not production code.
ignore = ["test/**", "script/**"]
# Reviewed and excluded, with the reason (spec §12):
# - reentrancy-events: the only external call that can precede an event is the ERC-1271 STATICCALL to the signer's
#   own wallet (it cannot write state, so it cannot reorder or fabricate logs), plus OpenZeppelin's owner-only upgrade.
# - block-timestamp: expiry and signature deadlines are in seconds; a validator's few seconds of drift are harmless.
# - require-revert-in-loop: the loops run over the caller's own input, and reverting on bad input is intended.
exclude_lints = ["reentrancy-events", "block-timestamp", "require-revert-in-loop"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
