<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Valuetrade mark: two candles on the terminal's own surface colour.
       Deliberately our own - a plain price-action glyph, no borrowed brand. -->
  <rect width="32" height="32" rx="6" fill="#1b1a14"/>
  <rect x="9"  y="9"  width="4" height="14" rx="1" fill="#00b481"/>
  <rect x="10.5" y="5.5" width="1" height="4" fill="#00b481"/>
  <rect x="10.5" y="22.5" width="1" height="4" fill="#00b481"/>
  <rect x="19" y="13" width="4" height="10" rx="1" fill="#ef4a3c"/>
  <rect x="20.5" y="9" width="1" height="4" fill="#ef4a3c"/>
  <rect x="20.5" y="22.5" width="1" height="4" fill="#ef4a3c"/>
</svg>
