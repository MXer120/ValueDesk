<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- ValueDesk mark: a "V" of five rounded blocks, white arms and a green point, on a dark tile.
       Rectangles only (tools/favicon.mjs draws favicon.ico from them; components/BrandMark.tsx
       draws the same five blocks, bare, beside the wordmark and in the rail). Our own glyph. -->
  <rect width="32" height="32" rx="7" fill="#121212"/>
  <rect x="4" y="8" width="4" height="5" rx="1" fill="#f4f4f4"/>
  <rect x="24" y="8" width="4" height="5" rx="1" fill="#f4f4f4"/>
  <rect x="9" y="14" width="4" height="5" rx="1" fill="#f4f4f4"/>
  <rect x="19" y="14" width="4" height="5" rx="1" fill="#f4f4f4"/>
  <rect x="14" y="20" width="4" height="5" rx="1" fill="#00b481"/>
</svg>
